# Extract BigQuery lineage.
#
# Two sources are configured here, but only one currently works against
# the mdi-governance project given the SA's permissions:
#
#   1. View definitions    — works. OM parses CREATE VIEW DDL out of the
#                            BigQuery catalog.
#   2. Query-log lineage   — DOES NOT WORK without
#                            `bigquery.jobs.list` plus query access on the
#                            INFORMATION_SCHEMA.JOBS_BY_PROJECT view in the
#                            relevant region. The current SA returns 403:
#                            "User does not have permission to query table
#                            mdi-governance:region-us.INFORMATION_SCHEMA.
#                            JOBS_BY_PROJECT". Granting roles/bigquery.jobUser
#                            on the project (or roles/bigquery.resourceViewer
#                            for read-only access to job metadata) fixes it.
#
# Run anyway — view lineage adds value even without query lineage.

source:
  type: bigquery-lineage
  serviceName: dgt-bigquery
  serviceConnection:
    config:
      type: BigQuery
      credentials:
        gcpConfig:
          type: gcp_credential_path
          path: /opt/secrets/gcp-sa.json
          projectId:
            - mdi-governance
  sourceConfig:
    config:
      type: DatabaseLineage
      queryLogDuration: 30
      parsingTimeoutLimit: 300
      resultLimit: 1000
      databaseFilterPattern:
        includes:
          - ^mdi-governance$
      schemaFilterPattern:
        includes:
          - ^etep$
          - ^etep_om$
          - ^pseudopeople$
      processViewLineage: true
      # SA was granted roles/bigquery.resourceAdmin on 2026-05-29
      # (provides bigquery.jobs.listAll), so query-lineage extraction
      # via INFORMATION_SCHEMA.JOBS_BY_PROJECT now works.
      processQueryLineage: true
      processStoredProcedureLineage: true

sink:
  type: metadata-rest
  config: {}

workflowConfig:
  openMetadataServerConfig:
    hostPort: http://openmetadata-server:8585/api
    authProvider: openmetadata
    securityConfig:
      jwtToken: ${OM_JWT_TOKEN}
  loggerLevel: INFO

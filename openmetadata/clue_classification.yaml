# Auto-classify the CLUE schema: stores sample data, runs OM's built-in
# Auto Classification engine (NER + regex on samples) to tag PII / sensitive
# columns automatically. Reference:
#   https://docs.open-metadata.org/how-to-guides/data-governance/classification/auto
#
# Why a dedicated workflow (not just the profiler)?
#   In OM 1.6+ Auto Classification was split out of the profiler into its own
#   workflow type. The profiler computes column statistics; this one stores
#   sample rows and applies classification tags.
#
# Run: metadata classify -c /opt/airflow/openmetadata/clue_classification.yaml

source:
  type: postgres
  serviceName: dgt-governance
  serviceConnection:
    config:
      type: Postgres
      hostPort: governance_pg:5432
      username: ${GOV_DB_USER}
      authType:
        password: ${GOV_DB_PASSWORD}
      database: ${GOV_DB_NAME}
  sourceConfig:
    config:
      type: AutoClassification
      storeSampleData: true
      enableAutoClassification: true
      schemaFilterPattern:
        includes:
          - ^clue$

# A processor block is structurally required even for AutoClassification —
# the SamplerProcessor calls config.processor.model_dump() unconditionally
# (sampler/processor.py:83). Leaving it empty is the canonical "no overrides"
# value; per-table sample sizes can be added under config.tableConfig.
processor:
  type: orm-profiler
  config: {}

sink:
  type: metadata-rest
  config: {}

workflowConfig:
  openMetadataServerConfig:
    hostPort: http://openmetadata-server:8585/api
    authProvider: openmetadata
    securityConfig:
      jwtToken: ${OM_JWT_TOKEN}
  loggerLevel: INFO

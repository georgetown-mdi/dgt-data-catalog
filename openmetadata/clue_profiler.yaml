# Profile the CLUE tables and views — populates the Profiler & Sample Data
# tabs in OpenMetadata. Run after governance_ingestion.yaml.

source:
  type: postgres
  serviceName: dgt-governance
  serviceConnection:
    config:
      type: Postgres
      hostPort: governance_pg:5432
      username: ${GOV_DB_USER}
      authType:
        password: ${GOV_DB_PASSWORD}
      database: ${GOV_DB_NAME}
  sourceConfig:
    config:
      type: Profiler
      computeMetrics: true
      profileSample: 80
      includeViews: true
      schemaFilterPattern:
        includes:
          - ^clue$
processor:
  type: orm-profiler
  config:
    tableConfig:
      - fullyQualifiedName: dgt-governance.${GOV_DB_NAME}.clue.final_cases
        sampleDataCount: 50
      - fullyQualifiedName: dgt-governance.${GOV_DB_NAME}.clue.final_defendants
        sampleDataCount: 50
      - fullyQualifiedName: dgt-governance.${GOV_DB_NAME}.clue.final_plaintiffs
        sampleDataCount: 50
      - fullyQualifiedName: dgt-governance.${GOV_DB_NAME}.clue.source_data
        sampleDataCount: 50
      - fullyQualifiedName: dgt-governance.${GOV_DB_NAME}.clue.case_types
        sampleDataCount: 50
sink:
  type: metadata-rest
  config: {}
workflowConfig:
  openMetadataServerConfig:
    hostPort: http://openmetadata-server:8585/api
    authProvider: openmetadata
    securityConfig:
      jwtToken: ${OM_JWT_TOKEN}
  loggerLevel: INFO
